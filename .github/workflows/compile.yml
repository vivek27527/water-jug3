
name: Compile and Run C++

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository code
        uses: actions/checkout@v4

      - name: Compile C++ program
        run: g++ -std=c++17 -Wall week3.cpp -o week3

      - name: Run C++ program
        run: ./week3
